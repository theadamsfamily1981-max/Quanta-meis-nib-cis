apiVersion: apps/v1
kind: Deployment
metadata:
  name: tfan-server
  labels:
    app: tfan-server
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tfan-server
  template:
    metadata:
      labels:
        app: tfan-server
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      # Init container to check model availability
      initContainers:
      - name: check-model
        image: busybox:1.35
        command: ['sh', '-c', 'until [ -f /models/tfan_model.pt ]; do echo waiting for model; sleep 2; done']
        volumeMounts:
        - name: model-volume
          mountPath: /models
          readOnly: true

      containers:
      - name: tfan-server
        image: tfan-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: TFAN_MODEL_PATH
          value: "/app/models/tfan_model.pt"
        - name: LOG_LEVEL
          value: "INFO"
        - name: MAX_BATCH_SIZE
          value: "32"
        - name: MAX_WAIT_MS
          value: "50"

        # Resource limits and requests
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
            # Uncomment for GPU
            # nvidia.com/gpu: 1

        # Liveness probe
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        # Readiness probe
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3

        # Volume mounts
        volumeMounts:
        - name: model-volume
          mountPath: /app/models
          readOnly: true
        - name: logs-volume
          mountPath: /app/logs

      # Volumes
      volumes:
      - name: model-volume
        persistentVolumeClaim:
          claimName: tfan-model-pvc
      - name: logs-volume
        emptyDir: {}

      # Node affinity (optional - for GPU nodes)
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #       - matchExpressions:
      #         - key: accelerator
      #           operator: In
      #           values:
      #           - nvidia-tesla-v100
      #           - nvidia-tesla-t4

      # Tolerations (optional - for GPU nodes)
      # tolerations:
      # - key: nvidia.com/gpu
      #   operator: Exists
      #   effect: NoSchedule
