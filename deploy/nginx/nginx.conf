events {
    worker_connections 1024;
}

http {
    upstream tfan_backend {
        # Round-robin load balancing
        server tfan-server:8000;
        # Add more servers for scaling:
        # server tfan-server-2:8000;
        # server tfan-server-3:8000;

        # Health check
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Logging
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        client_body_buffer_size 128k;
        client_max_body_size 10m;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API endpoints
        location / {
            proxy_pass http://tfan_backend;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://tfan_backend/health;
            access_log off;
        }

        # Metrics endpoint
        location /metrics {
            proxy_pass http://tfan_backend/metrics;
        }
    }
}
