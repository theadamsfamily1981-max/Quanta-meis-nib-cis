[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tfan"
version = "0.1.0"
description = "TFAN prototype: SSA/TLS/FDT/PGU/memory-α integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "rich>=13.7",
    "z3-solver>=4.12",
    "gudhi>=3.9.0",
    "ripser>=0.6.4",
]

[project.scripts]
tfan = "tfan.runner:main"

[tool.setuptools]
packages = ["tfan"]
