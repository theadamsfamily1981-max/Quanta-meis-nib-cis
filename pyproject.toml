[tool.poetry]
name = "quanta-meis-nib-cis"
version = "0.1.0"
description = "QUANTA / MEIS / NIB research stack: orchestrator, NIB core, MAM, SNN, and experiment runner"
authors = ["Croft Adams <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "meis" },
    { include = "experiments" }
]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
pyyaml = "^6.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.6.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

# ---- Ruff configuration ---------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
