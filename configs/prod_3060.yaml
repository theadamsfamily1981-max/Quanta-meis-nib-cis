# Production config for RTX 3060 (12GB VRAM)
model:
  max_context: 12288
  batch_size: 2

attention:
  keep_ratio: 0.30
  flash_attn: false
  persistence_weight: 0.7
  num_heads: 8
  dropout: 0.1
  radius_scale: 2.0
  use_radial_sparse: true

memory:
  resident_pages: 3
  page_size: 1024

pgu:
  timeout_ms: 120
  cache_size: 5000

fdt:
  pid:
    kp: 0.25
    ki: 0.03
    kd: 0.08
  epr:
    window: 120
    threshold: 0.15

gates:
  alpha_max: 1.0
  pgu_p95_max_ms: 200.0
  epr_cv_max: 0.15

topology:
  enable: false  # Disabled on 3060 to save memory
  num_landscapes: 5
  resolution: 100
  max_dim: 1
  kl_prior_weight: 0.01
  engine: "auto"

dph:
  exact_ph_nightly:
    enable: false
    schedule: "0 2 * * *"
    wasserstein_threshold: 0.02
    cosine_threshold: 0.90
