name: CI

on:
  push:
    branches: [ main, feature/**, scaffold/**, tools/** ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps (linters + test)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # allow repo to import packages even if not packaged
          pip install -e . || true

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Mypy (lenient)
        run: mypy --config-file mypy.ini || true

      - name: Pytest
        run: pytest -q

      - name: Upload suite artifact if present
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production_suite
          path: reports/production_hardening_demo.json
          if-no-files-found: ignore
