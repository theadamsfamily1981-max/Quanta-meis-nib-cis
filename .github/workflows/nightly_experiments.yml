name: Nightly Experiment Runner

on:
  schedule:
    - cron: "0 5 * * *"        # runs daily at 05:00 UTC
  workflow_dispatch:            # manual trigger

jobs:
  run-experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 🧠 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision ripser persim matplotlib pandas

      - name: 🧪 Execute Phases 3–5 experiments
        working-directory: research/antifragility_paper/code
        run: |
          echo "Running antifragility experiments..."
          python phase3_ph_stability.py || true
          python phase4_architecture_morph.py || true
          python phase5_domain_shift.py || true

      - name: 📊 Merge outputs
        run: |
          mkdir -p research/antifragility_paper/data
          python - <<'PYCODE'
import pandas as pd, glob
paths = glob.glob("research/antifragility_paper/code/*.csv")
dfs = [pd.read_csv(p) for p in paths if p.endswith(".csv")]
if dfs:
    merged = pd.concat(dfs, ignore_index=True)
    merged.to_csv("research/antifragility_paper/data/merged_experiment_summary.csv", index=False)
          PYCODE

      - name: 💾 Commit merged data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          git add research/antifragility_paper/data/merged_experiment_summary.csv
          git commit -m "Nightly auto-update: merged experiment summary [skip ci]" || echo "No changes"
          git push

      - name: 🚀 Trigger paper build
        uses: peter-evans/workflow-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          workflow: build_antifragility_publication.yml
