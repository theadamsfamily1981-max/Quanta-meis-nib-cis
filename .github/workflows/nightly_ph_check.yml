name: Nightly PH Check
on:
  schedule: [{ cron: "0 6 * * *" }]
jobs:
  ph:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: pip install -r requirements.txt
      - run: python bench/latency_sentry.py
