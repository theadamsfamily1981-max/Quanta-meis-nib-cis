name: Nightly Pareto

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m bench.memory_powerlaw | tee artifacts/memory_alpha.json
