name: Nightly Pareto Sweep
on:
  schedule: [{ cron: "0 6 * * *" }]
jobs:
  pareto:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: pip install -r requirements.txt
      - run: python -m bench.memory_powerlaw | tee artifacts/memory_alpha.json
