name: Implementation Scaffold Check

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml torch
      - name: Run scaffold validation
        run: |
          python - <<'PY'
from pathlib import Path

required = [
    'core_system/tfan.py',
    'core_system/nib_loop.py',
    'core_system/meis_orchestrator.py',
    'core_system/antifragility.py',
    'core_system/multimodal_adapter.py',
]

missing = [path for path in required if not Path(path).exists()]
if missing:
    raise SystemExit(f"Missing required scaffolds: {missing}")
print('All scaffolds present.')
PY
