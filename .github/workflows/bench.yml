name: Bench (Baselines + QUANTA)

on:
  workflow_dispatch: {}
  pull_request:
    types: [labeled]

jobs:
  bench:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'bench')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Smoke tests
        run: |
          python -m pytest -q || true

      - name: Run bio baselines (CPU-safe)
        run: |
          python scripts/run_bio_baselines.py || true

      - name: Run QUANTA bench (CPU-safe)
        run: |
          python scripts/run_quanta_bench.py || true

      - name: List artifacts
        run: |
          echo '\n== reports =='
          ls -R reports || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-artifacts
          path: |
            reports/bio_baselines.json
            reports/quanta/*.json
          if-no-files-found: warn
