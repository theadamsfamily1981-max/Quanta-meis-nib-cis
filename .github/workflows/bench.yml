name: Bench (INNOV priority)

on:
  workflow_dispatch: {}
  pull_request:
    types: [labeled, synchronize]

jobs:
  bench-priority:
    if: github.event_name == 'workflow_dispatch' || (github.event.label.name == 'bench')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . || true

      - name: Run priority suite (001/016/036)
        run: |
          python scripts/run_innov_priority.py > reports/innov_priority.json
          echo "
Preview:" && cat reports/innov_priority.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: innov-priority-json
          path: reports/innov_priority.json
          if-no-files-found: error
