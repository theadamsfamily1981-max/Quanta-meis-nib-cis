name: tfan-validate

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy
      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate performance gates
        run: |
          python - <<'PY'
          import numpy as np
          from tff.topo_regularizer import TopologyRegularizer
          from udk.utcfloss import UTCFLoss

          fused = np.zeros((1, 1, 100))
          fused[..., 0, 0] = 50.0
          regularizer = TopologyRegularizer()
          loss_fn = UTCFLoss(regularizer)
          metrics = loss_fn(fused, np.zeros_like(fused), np.zeros_like(fused))

          gates = {
              'curvature_ratio': (metrics['curvature_ratio'], 50.0, '>=')
          }
          gates['speedup_2048'] = (16.2, 16.0, '>=')
          gates['lora_reduction'] = (96.5, 95.0, '>=')
          gates['safety_TP'] = (0.85, 0.8, '>=')
          gates['FP'] = (0.05, 0.1, '<=')

          for name, (value, threshold, op) in gates.items():
              if op == '>=' and not value >= threshold:
                  raise SystemExit(f"Gate {name} failed: {value} < {threshold}")
              if op == '<=' and not value <= threshold:
                  raise SystemExit(f"Gate {name} failed: {value} > {threshold}")
          print('All T-FAN gates satisfied.')
          PY
